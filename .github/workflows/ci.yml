name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建（.NET Framework csc）
        shell: pwsh
        run: ./build.ps1 -Tests -Clean

      - name: 单元测试
        shell: pwsh
        run: |
          ./dist/tests/LabVIEWDialogWatchdog.Tests.exe "$env:RUNNER_TEMP\watchdog-unit"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 扫描冒烟
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\scan.json"
          ./dist/LabVIEWDialogWatchdog.exe --scan --json --out $out
          $deadline = (Get-Date).AddSeconds(10)
          while (-not (Test-Path -LiteralPath $out) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 200
          }
          Get-Content -LiteralPath $out -Raw

      - uses: actions/upload-artifact@v4
        with:
          name: LabVIEWDialogWatchdog
          path: dist/LabVIEWDialogWatchdog.exe
