name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建（.NET Framework csc）
        shell: pwsh
        run: ./build.ps1 -Tests -Clean

      - name: 单元测试
        shell: pwsh
        run: |
          ./dist/tests/LabVIEWInternalDialogWatchdog.Tests.exe "$env:RUNNER_TEMP\watchdog-unit"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 扫描冒烟
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\scan.json"
          ./dist/LabVIEWInternalDialogWatchdog.exe --scan --json --out $out
          $deadline = (Get-Date).AddSeconds(10)
          while (-not (Test-Path -LiteralPath $out) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 200
          }
          if (-not (Test-Path -LiteralPath $out)) { throw '扫描结果文件未生成' }
          $text = Get-Content -LiteralPath $out -Raw -Encoding UTF8
          $items = @($text | ConvertFrom-Json)
          Write-Output ("scan items: " + $items.Count)
          if ($text.Trim() -notmatch '^\[.*\]$') { throw "扫描结果不是 JSON 数组: $text" }

      - uses: actions/upload-artifact@v4
        with:
          name: LabVIEWInternalDialogWatchdog
          path: dist/LabVIEWInternalDialogWatchdog.exe

  e2e:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 构建测试夹具
        shell: pwsh
        run: ./build.ps1 -Tests -Clean

      - name: 端到端（对话框夹具）
        shell: pwsh
        run: |
          ./tests/run-tests.ps1 -SkipBuild -TempDir "$env:RUNNER_TEMP\watchdog-e2e"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与程序集版本一致
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $expected = $tag.TrimStart('v')
          $line = Select-String -Path src/AssemblyInfo.cs -Pattern 'AssemblyVersion\("([\d.]+)"\)'
          $version = $line.Matches[0].Groups[1].Value
          $actual = ($version -split '\.')[0..2] -join '.'
          if ($actual -ne $expected) { throw "tag $tag 与 AssemblyVersion $version 不一致" }

      - uses: actions/download-artifact@v4
        with:
          name: LabVIEWInternalDialogWatchdog
          path: dist

      - name: 发布 portable exe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/LabVIEWInternalDialogWatchdog.exe" \
            --title "LabVIEW Internal Dialog Watchdog $GITHUB_REF_NAME" \
            --generate-notes
